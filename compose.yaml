services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: training
      POSTGRES_PASSWORD: training
      POSTGRES_DB: training
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - training_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U training -d training"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://training:training@db:5432/training
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  training_db:
